<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Moved</title><!-- edit:title -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #B5BD00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .redirect-container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-message {
            font-size: 28px;
            font-weight: 600;
            color: #333F48;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .new-url {
            color: #009681;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .new-url:hover {
            color: #007a6b;
            border-bottom-color: #007a6b;
        }

        .countdown-container {
            margin-top: 40px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 12px;
            border-left: 4px solid #009681;
        }

        .countdown-text {
            font-size: 16px;
            color: #333F48;
            margin-bottom: 10px;
        }

        .countdown-number {
            font-size: 48px;
            font-weight: bold;
            color: #009681;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #009681;
            border-radius: 2px;
            transition: width 1s linear;
        }

        @media (max-width: 600px) {
            .redirect-container {
                padding: 30px 25px;
            }
            
            .main-message {
                font-size: 24px;
            }
            
            .countdown-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="main-message">
            The website has a new home here:<br>
            <a href="https://quadram-institute-bioscience.github.io/" class="new-url" target="_blank"><!-- edit:url -->
                https://quadram-institute-bioscience.github.io/            </a><!-- edit:url -->
        </div>
        
        <div class="countdown-container">
            <div class="countdown-text">You will be redirected in</div>
            <div class="countdown-number" id="countdown">5</div>
            <div class="countdown-text">seconds</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <script>
        // <!-- edit:NEW_URL -->
        const NEW_URL = 'https://quadram-institute-bioscience.github.io/';
        let countdown = 5;
        
        const countdownElement = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        
        // Update progress bar initial width
        progressBar.style.width = '100%';
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            // Update progress bar
            const progressPercent = (countdown / 5) * 100;
            progressBar.style.width = progressPercent + '%';
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = NEW_URL;
            }
        }, 1000);
        
        // Allow immediate redirect if user clicks the link
        document.querySelector('.new-url').addEventListener('click', () => {
            clearInterval(timer);
        });
    </script>
</body>
</html>
